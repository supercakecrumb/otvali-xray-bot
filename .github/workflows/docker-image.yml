name: Docker Image CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Superseded branch/PR checks may stop; an in-flight release must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The existing stage runs vendored tests and builds with Go1.27.2.
      - name: Test and build
        run: docker build --target build --tag "otvali-ci-build:${GITHUB_SHA}" .

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Serialize registry writes, including the legacy mutable latest alias.
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate event release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(
              r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
              r'(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?',
              tag,
          )
          if not match or len(tag) > 128:
              raise SystemExit('Expected a Docker-compatible vX.Y.Z release tag')
          prerelease = match.group(4)
          if prerelease and any(
              len(part) > 1 and part.isdigit() and part.startswith('0')
              for part in prerelease.split('.')
          ):
              raise SystemExit('Numeric prerelease identifiers must not have leading zeros')
          image = 'ghcr.io/' + os.environ['RELEASE_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\nimage={image}\n')

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0, Node24
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node24
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
